name: Demo-Katalog veröffentlichen

on:
  push:
    branches:
      - main
    paths:
      - "RegExPQ/DemoCatalog.*.vb"
      - "RegExPQ/DemoRunner.vb"
      - "RegExPQ/Demos/**"
      - "catalog/**"
      - ".github/workflows/demo-catalog-pages.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Demo-Katalog erzeugen
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$RELEASE_TAG"
          if [ -z "$version" ]; then
            version=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || printf 'main')
          fi
          node catalog/scripts/import-vsto-catalog.js . catalog/site/demo-data.js "$version"

      - name: Katalog prüfen
        run: |
          node --check catalog/site/app.js
          node --check catalog/site/catalog-core.js
          node --check catalog/site/demo-data.js

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: catalog/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v6
